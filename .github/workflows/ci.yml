name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public URL of the agent proxy (not a secret). Unset → offline demo agent only.
          VITE_AGENT_PROXY_URL: ${{ vars.AGENT_PROXY_URL }}
          # Desktop showcase video (YouTube/Vimeo/https embed, or a .mp4/.webm URL or path in public/). Unset → placeholder.
          VITE_SHOWCASE_VIDEO_URL: ${{ vars.SHOWCASE_VIDEO_URL }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
